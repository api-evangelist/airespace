name: Airespace
description: 'Airespace, Inc. (formerly Black Storm Networks) was an American enterprise
  networking systems company founded in 2001 by Pat Calhoun, Bob Friday, Bob O''Hara
  and Ajay Mishra, manufacturing wireless LAN access points and the controllers that
  managed them. Airespace pioneered the centralized AP-controller architecture for
  rapid enterprise Wi-Fi deployment and authored the Lightweight Access Point Protocol
  (LWAPP), the direct precursor to the IETF CAPWAP standard, and was first to market
  with integrated Wi-Fi location tracking. It was venture backed by Storm Ventures,
  Norwest Venture Partners, Fidelity Investments and Battery Ventures, and shipped
  OEM equipment through NEC, Alcatel and Nortel. Cisco Systems acquired Airespace in
  2005 for $450 million and merged its products into the Cisco Aironet line. The company
  no longer operates independently and publishes no API, developer portal or documentation;
  the airespace.com domain is parked and listed for sale.'
